# L.U.C.E.R.O <-> ZeroClaw (hosted brain + WhatsApp Web QR for dashboard)
#
# Omit pair_phone so ZeroClaw emits a QR. pair_relay.py captures it and
# publishes a scannable PNG to Lucero Channels for the client to scan.

schema_version = 3

[providers.models.custom.default]
uri = "https://lucero-api-production.up.railway.app/v1"
api_key = "env:LUCERO_CHANNEL_API_KEY"
model = "lucero/agents"
wire_api = "chat_completions"

[risk_profiles.default]
level = "supervised"

[runtime_profiles.default]

[agents.primary]
enabled = true
model_provider = "custom.default"
risk_profile = "default"
runtime_profile = "default"
channels = ["whatsapp.home"]

[channels.whatsapp.home]
mode = "personal"
dm_policy = "all"
group_policy = "ignore"
self_chat_mode = true
session_path = "~/.zeroclaw/state/whatsapp-web/session.db"

[channels_config.whatsapp]
session_path = "~/.zeroclaw/state/whatsapp-web/session.db"
allowed_numbers = ["*"]

[peer_groups.whatsapp_home]
channel = "whatsapp.home"
agents = ["primary"]
external_peers = ["*"]
