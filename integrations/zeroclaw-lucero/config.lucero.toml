# L.U.C.E.R.O <-> ZeroClaw template (hosted brain)
# Used by Docker/Railway WhatsApp sidecar and scripts/start-zeroclaw.ps1.
#
# Brain: L.U.C.E.R.O FastAPI OpenAI-compat bridge on Railway.

schema_version = 3

[providers.models.custom.default]
uri = "https://lucero-api-production.up.railway.app/v1"
api_key = "env:LUCERO_CHANNEL_API_KEY"
model = "lucero/agents"
wire_api = "chat_completions"

[risk_profiles.default]
level = "supervised"

[runtime_profiles.default]

[agents.primary]
enabled = true
model_provider = "custom.default"
risk_profile = "default"
runtime_profile = "default"
channels = ["whatsapp.home"]

# dm_policy=all: every customer who DMs the linked business WhatsApp gets a reply.
# Optional owner mapping still lives in Lucero Dashboard → Channels.
[channels.whatsapp.home]
enabled = true
mode = "personal"
dm_policy = "all"
group_policy = "ignore"
self_chat_mode = true
# Business WhatsApp to link via pair code (digits only, country code, no +).
# Override with ZEROCLAW_PAIR_PHONE at deploy. Example Pakistan: 923203628978
pair_phone = "923203628978"
session_path = "~/.zeroclaw/state/whatsapp-web/session.db"

[peer_groups.whatsapp_home]
channel = "whatsapp.home"
agents = ["primary"]
# Accept all inbound DM peers; Lucero brain handles identity / Support path.
external_peers = ["*"]
