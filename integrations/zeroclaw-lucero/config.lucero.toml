# L.U.C.E.R.O <-> ZeroClaw (hosted brain + WhatsApp Web pair-code)
# Pairing: use digits-only pair_phone so ZeroClaw prints an 8-char code
# (Railway web Deploy Logs cannot render a scannable QR).

schema_version = 3

[providers.models.custom.default]
uri = "https://lucero-api-production.up.railway.app/v1"
api_key = "env:LUCERO_CHANNEL_API_KEY"
model = "lucero/agents"
wire_api = "chat_completions"

[risk_profiles.default]
level = "supervised"

[runtime_profiles.default]

[agents.primary]
enabled = true
model_provider = "custom.default"
risk_profile = "default"
runtime_profile = "default"
channels = ["whatsapp.home"]

[channels.whatsapp.home]
mode = "personal"
dm_policy = "all"
group_policy = "ignore"
self_chat_mode = true
# Digits only (no +). Override with ZEROCLAW_PAIR_PHONE.
pair_phone = "923203628978"
session_path = "~/.zeroclaw/state/whatsapp-web/session.db"

# Some ZeroClaw builds still resolve Web settings from channels_config.
[channels_config.whatsapp]
session_path = "~/.zeroclaw/state/whatsapp-web/session.db"
pair_phone = "923203628978"
allowed_numbers = ["*"]

[peer_groups.whatsapp_home]
channel = "whatsapp.home"
agents = ["primary"]
external_peers = ["*"]
